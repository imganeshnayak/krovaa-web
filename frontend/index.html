<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/krovaa-logo.svg?v=3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>Krovaa | Elite Vendor-Client Chat</title>
  <meta name="title" content="Krovaa | Elite Vendor-Client Chat" />
  <meta name="description"
    content="A premium vendor-client chat application designed for seamless professional communication, speed, and visual excellence." />
  <meta name="author" content="Krovaa Team" />
  <meta name="theme-color" content="#161b2c" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://Krovaa.com/" />
  <meta property="og:title" content="Krovaa | Elite Vendor-Client Chat" />
  <meta property="og:description"
    content="Professional vendor-client communication with stunning design and seamless user experience." />
  <meta property="og:image" content="/krovaa-logo.svg?v=3" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://Krovaa.com/" />
  <meta property="twitter:title" content="Krovaa | Elite Vendor-Client Chat" />
  <meta property="twitter:description"
    content="Professional vendor-client communication with stunning design and seamless user experience." />
  <meta property="twitter:image" content="/krovaa-logo.svg?v=3" />

  <link rel="preload" href="/fonts/rubik-latin-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/rubik-latin-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/syne-latin-700.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    /* Prevent initial white flash in dark mode */
    body {
      background-color: #161b2c;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <main id="main-content">
    <div id="root">
      <style>
        .initial-loader {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: #161b2c;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 9999;
        }

        .initial-loader-spinner {
          width: 40px;
          height: 40px;
          border: 3px solid rgba(255, 255, 255, 0.1);
          border-radius: 50%;
          border-top-color: #00A4EF;
          animation: initial-spin 1s ease-in-out infinite;
        }

        @keyframes initial-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
